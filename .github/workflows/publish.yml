name: Render & deploy course site

# Os decks e as páginas de aula trazem blocos R com `eval: false`, mas os
# walkthroughs das aulas 04 e 06 e o `relatorio-modelo.qmd` EXECUTAM código
# de verdade: leem `dados/anuros_altitude.csv`, ajustam modelos e desenham
# gráficos. Por isso o passo de instalação abaixo vai além do knitr.
# Se um walkthrough novo usar um pacote que não está na lista, o build
# quebra aqui — acrescente o pacote antes de fazer o push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-rpkgs-${{ hashFiles('.github/workflows/publish.yml') }}

      - name: Install R packages
        run: |
          Rscript -e 'options(repos = c(CRAN = Sys.getenv("RSPM", "https://packagemanager.posit.co/cran/__linux__/noble/latest"))); install.packages(c("rmarkdown", "knitr", "here", "dplyr", "tidyr", "ggplot2", "broom", "purrr"))'

      - name: Render site
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
