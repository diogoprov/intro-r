name: Render & deploy course site

# Os decks e as páginas de aula trazem blocos R com `eval: false`, mas os
# walkthroughs das aulas 04 e 06 e o `relatorio-modelo.qmd` EXECUTAM código
# de verdade: leem `dados/anuros_altitude.csv`, ajustam modelos e desenham
# gráficos. Por isso o passo de instalação abaixo vai além do knitr.
# Se um walkthrough novo usar um pacote que não está na lista, o build
# quebra aqui — acrescente o pacote antes de fazer o push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-rpkgs-${{ hashFiles('.github/workflows/publish.yml') }}

      - name: Install R packages
        run: |
          Rscript -e 'options(repos = c(CRAN = Sys.getenv("RSPM", "https://packagemanager.posit.co/cran/__linux__/noble/latest"))); install.packages(c("rmarkdown", "knitr", "here", "dplyr", "tidyr", "ggplot2", "broom", "purrr", "performance", "see"))'

      - name: Render site
        run: quarto render

      # O check_model() do walkthrough da aula 06 falha de um jeito silencioso:
      # com fig-height abaixo de 5 os seis paineis nao cabem, o knitr descarta
      # a figura e NAO emite erro nem aviso. O site compila sem a figura e
      # ninguem percebe. Esta assercao existe para que isso vire build vermelho.
      - name: Conferir que as figuras dos walkthroughs foram geradas
        run: |
          faltou=0
          for f in \
            docs/aula-06-modelos-lineares/walkthrough-aula-06_files/figure-html/fig-checkmodel-1.png \
            docs/aula-06-modelos-lineares/walkthrough-aula-06_files/figure-html/fig-diag4-1.png \
            docs/aula-06-modelos-lineares/walkthrough-aula-06_files/figure-html/fig-serras-1.png
          do
            if [ ! -s "$f" ]; then
              echo "::error::figura ausente ou vazia: $f"
              echo "Se for a fig-checkmodel, quase certamente o fig-height caiu abaixo de 5."
              faltou=1
            else
              echo "ok  $(wc -c < "$f") bytes  $f"
            fi
          done
          exit $faltou

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
